# Drive commands, odometry, TF and joint states are provided directly
# by ros2_control and therefore must not be bridged here.

# Gazebo simulation clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  qos_profile: CLOCK

# Raw simulated LD06 output. The same ROS filter used by the physical
# LD06 converts /scan_raw into the navigation-facing /scan topic.
- ros_topic_name: "/scan_raw"
  gz_topic_name: "/ld06/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# Simulated chassis IMU
- ros_topic_name: "/k9/imu"
  gz_topic_name: "/k9/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# Simulated ear sensors. These remain LaserScan topics in Gazebo.
- ros_topic_name: "/l_ear/scan"
  gz_topic_name: "/l_ear/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: "/r_ear/scan"
  gz_topic_name: "/r_ear/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# Match the physical OAK depth-camera topic names.

- ros_topic_name: "/oak/stereo/camera_info"
  gz_topic_name: "/oak/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: "/oak/points"
  gz_topic_name: "/oak/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA